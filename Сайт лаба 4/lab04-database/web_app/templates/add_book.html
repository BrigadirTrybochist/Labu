<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати книгу</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; }
        form { background: white; padding: 20px; max-width: 400px; border-radius: 5px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Додати нову книгу</h1>
    <form method="POST">
        <label>Назва:</label> <input type="text" name="title" required>
        <label>ISBN (13 символів):</label> <input type="text" name="isbn" maxlength="13" minlength="13" required>
        <label>Рік:</label> <input type="number" name="year" required>
        <label>Сторінок:</label> <input type="number" name="pages" required>
        <label>Ціна:</label> <input type="number" step="0.01" name="price" required>
        <label>Кількість на складі:</label> <input type="number" name="stock" required>
        
        <label>Автор:</label>
        <select name="author_id" required>
            {% for a in authors %}<option value="{{ a[0] }}">{{ a[1] }}</option>{% endfor %}
        </select>

        <label>Видавництво:</label>
        <select name="pub_id" required>
            {% for p in publishers %}<option value="{{ p[0] }}">{{ p[1] }}</option>{% endfor %}
        </select>

        <label>Жанр:</label>
        <select name="genre_id" required>
            {% for g in genres %}<option value="{{ g[0] }}">{{ g[1] }}</option>{% endfor %}
        </select>

        <button type="submit">Зберегти</button>
        <a href="{{ url_for('books') }}">Скасувати</a>
    </form>
</body>
</html>
